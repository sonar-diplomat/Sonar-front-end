version: '3'

tasks:
  release:
    desc: Typecheck and build the API frontend without fetching demo media
    env:
      VITE_DATA_SOURCE: api
      VITE_BASE_PATH: /
    preconditions:
      - sh: node -e "if(!require('node:fs').existsSync('node_modules/typescript'))process.exit(1)"
        msg: Run npm ci first
    cmds:
      - npm run build
      - npm run release:verify

  demo:
    desc: Compile the mock frontend and JSON (binary media is packaged separately)
    env:
      VITE_DATA_SOURCE: mock
    preconditions:
      - sh: node -e "if(!require('node:fs').existsSync('demo/data/seed.json'))process.exit(1)"
        msg: Demo seed is missing
    cmds: [npm run build:demo]
