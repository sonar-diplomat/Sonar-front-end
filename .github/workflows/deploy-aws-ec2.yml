name: Deploy Frontend to Test Server (AWS EC2 + ECR)

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: sonar/frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: "[1/6] Checkout repository"
        uses: actions/checkout@v4

      - name: "[2/6] Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: "[3/6] Login to Amazon ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: "[4/6] Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "[5/6] Build and push frontend image to ECR"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL_AWS }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "[6/6] Deploy frontend on EC2 via SSH"
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}  # ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            AWS_REGION=${{ env.AWS_REGION }}
            ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
            ECR_REPOSITORY=${{ env.ECR_REPOSITORY }}
            IMAGE_TAG=${{ env.IMAGE_TAG }}

            echo "[EC2 1/5] Login to ECR"
            docker login \
              --username AWS \
              --password $(aws ecr get-login-password --region $AWS_REGION) \
              $ECR_REGISTRY

            echo "[EC2 2/5] Pull image $ECR_REPOSITORY:$IMAGE_TAG"
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            echo "[EC2 3/5] Stop and remove old container"
            docker stop sonar-frontend || true
            docker rm sonar-frontend || true

            echo "[EC2 4/5] Cleanup old 'latest' image (optional)"
            docker rmi $ECR_REGISTRY/$ECR_REPOSITORY:latest || echo "no old latest image"

            echo "[EC2 5/5] Run new container"
            docker run -d --name sonar-frontend \
              --restart unless-stopped \
              -p 8082:80 \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
              /usr/local/bin/cleanup-docker-images.sh
