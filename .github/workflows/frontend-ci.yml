name: Frontend CI
on:
  push:
    branches-ignore: [dev]
  pull_request:
  workflow_call:
permissions:
  contents: read
env:
  GIT_LFS_SKIP_SMUDGE: '1'
jobs:
  quality:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: { lfs: false, persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: task ci:tools
      - run: task ci:check
  release:
    name: API build and container (no LFS)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { lfs: false, persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: task build:release
      # Export/inspect actual context, builder and Nginx files.
      - run: task ci:docker
      - uses: actions/upload-artifact@v7
        with:
          name: release-audit
          path: test-results/docker-audit.json
          if-no-files-found: error
          retention-days: 7
  demo:
    name: Compile demo (JSON, no binaries)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { lfs: false, persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: task build:demo
        env:
          VITE_BASE_PATH: ${{ vars.PAGES_BASE || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-artifact@v7
        with:
          name: demo-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
  media:
    name: Fetch and verify media once
    needs: demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { lfs: false }
      - uses: ./.github/actions/setup
      # Only this job fetches LFS. Dependent jobs receive extracted bytes.
      - run: task media:pull
      - run: task media:verify
      - uses: actions/upload-artifact@v7
        with:
          name: demo-media
          path: demo/audio/
          if-no-files-found: error
          retention-days: 1
  package:
    name: Package and smoke test demo
    needs: [demo, media]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { lfs: false, persist-credentials: false }
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with: { name: demo-dist, path: dist/ }
      - uses: actions/download-artifact@v8
        with: { name: demo-media, path: demo/audio/ }
      - run: task pages:package
      - run: task pages:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: demo-pages
          path: .pages/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: pages-http-audit
          path: test-results/pages-smoke.json
          retention-days: 7
